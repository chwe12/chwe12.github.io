<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title> MarkdownPreviewer </title>
  <script type="module">

    (async () => {
      const { marked } = await import('https://cdn.jsdelivr.net/npm/marked/+esm');
      const createDOMPurify = (await import('https://cdn.jsdelivr.net/npm/dompurify@3.1.6/+esm')).default;
      const DOMPurify = createDOMPurify(window);

      const editor = document.getElementById('editor');
      const preview = document.getElementById('preview');

      const DEFAULT_MD = `# Markdown 即時預覽
 - **粗體**、*斜體*、\`code\`
 \`\`\`js
 console.log('Hello Markdown');
 \`\`\`
 `;
 
      editor.value = localStorage.getItem('md_preview_draft') ?? DEFAULT_MD;

      function render() {
        const raw = marked.parse(editor.value, { gfm: true, breaks: true });
        preview.innerHTML = DOMPurify.sanitize(raw, { USE_PROFILES: { html: true } });
        localStorage.setItem('md_preview_draft', editor.value);
      }
      editor.addEventListener('input', render);
      render();
    })();
  </script>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; }
    .wrap { display:grid; grid-template-columns:1fr 1fr; gap:12px; height:100vh; padding:12px; box-sizing:border-box; }
    textarea { width:100%; height:100%; font:14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding:12px; box-sizing:border-box; }
    .preview { width:100%; height:100%; overflow:auto; padding:12px; box-sizing:border-box; border-left:1px solid #ddd; }
  </style>
</head>
<body>
  <div class="wrap">
    <textarea id="editor" spellcheck="false" placeholder="在此輸入 Markdown 測試..."></textarea>
    <div id="preview" class="preview"></div>
  </div>
</body>
</html>
