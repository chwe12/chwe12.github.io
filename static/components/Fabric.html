<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>Fabric.js 圖片標註工具</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.4.0/dist/fabric.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui; }
    header { padding: 10px 12px; border-bottom: 1px solid #e5e5e5; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    button, label { padding: 6px 10px; border: 1px solid #d0d0d0; border-radius: 8px; background: #fff; cursor: pointer; }
    canvas { border: 1px solid #ddd; border-radius: 8px; max-width: 100%; }
    input[type="color"] { height: 32px; width: 40px; border-radius: 8px; border: 1px solid #ccc; }
    .right { margin-left:auto; color:#666; font-size:12px; }
    #wrap{ padding:12px; }
  </style>
</head>
<body>
  <header>
    <input id="file" type="file" accept="image/*" style="display:none" />
    <label for="file">上傳圖片</label>
    <button id="addRect">矩形</button>
    <button id="addCircle">圓形</button>
    <button id="addTriangle">三角形</button>
    <button id="addLine">直線</button>
    <button id="addArrow">箭頭</button>
    <button id="addText">文字</button>
    <button id="toggleDraw">畫筆：關</button>
    <span>描邊：</span><input id="strokeColor" type="color" value="#4f83cc" />
    <span>填滿：</span><input id="fillColor" type="color" value="#ffffff" />
    <button id="undo">復原</button>
    <button id="redo">重做</button>
    <button id="delete">刪除</button>
    <button id="clear">清空</button>
    <button id="download">下載 PNG</button>
    <div class="right">僅在本機瀏覽器執行，不上傳資料</div>
  </header>

  <div id="wrap">
    <canvas id="c" width="1200" height="700"></canvas>
  </div>

  <script>
    const canvas = new fabric.Canvas('c', { preserveObjectStacking: true });
    const undoStack = [], redoStack = [];

    function snapshot(){ redoStack.length = 0; undoStack.push(canvas.toJSON()); if(undoStack.length>50)undoStack.shift();}
    function pushChange(){ snapshot(); }
    canvas.on('object:added',pushChange); canvas.on('object:modified',pushChange); canvas.on('object:removed',pushChange);
    snapshot();

    const fileInput = document.getElementById('file');
    fileInput.onchange = e=>{
      const f=e.target.files[0]; if(!f)return;
      const r = new FileReader();
      r.onload = ()=>{
        fabric.Image.fromURL(r.result, img=>{
          const s = Math.min((canvas.width-40)/img.width,(canvas.height-40)/img.height,1);
          img.set({ left:20, top:20, scaleX:s, scaleY:s });
          canvas.add(img).setActiveObject(img);
        },{ crossOrigin:'anonymous' });
      }; r.readAsDataURL(f); e.target.value='';
    };

    const getStroke = ()=>document.getElementById('strokeColor').value;
    const getFill   = ()=>document.getElementById('fillColor').value;

    document.getElementById('addRect').onclick=()=>{
      canvas.add(new fabric.Rect({ left:80,top:80,width:160,height:100,stroke:getStroke(),fill:getFill(),strokeWidth:3 }));
    };
    document.getElementById('addCircle').onclick=()=>{
      canvas.add(new fabric.Circle({ left:80,top:80,radius:60,stroke:getStroke(),fill:getFill(),strokeWidth:3 }));
    };
    document.getElementById('addTriangle').onclick=()=>{
      canvas.add(new fabric.Triangle({ left:80,top:80,width:140,height:120,stroke:getStroke(),fill:getFill(),strokeWidth:3 }));
    };
    document.getElementById('addLine').onclick=()=>{
      canvas.add(new fabric.Line([80,80,200,80],{ stroke:getStroke(),strokeWidth:3 }));
    };

    document.getElementById('addArrow').onclick = () => {
      const fill = getStroke();
      const arrowPath =
        "M 0 0 L 140 0 L 140 -4 L 170 7 L 140 18 L 140 14 L 0 14 z"; 
      const arrow = new fabric.Path(arrowPath, {
        left: 100,
        top: 100,
        fill: fill,
        stroke: fill,
        strokeWidth: 2,
        originX: 'center',
        originY: 'center',
        selectable: true,
        hasBorders: true,
        objectCaching: false,
      });
      canvas.add(arrow).setActiveObject(arrow);
    };


    document.getElementById('addText').onclick=()=>{
      canvas.add(new fabric.IText('註解',{ left:100,top:100,fontSize:20,fill:getStroke() }));
    };

    let drawing=false;
    document.getElementById('toggleDraw').onclick=e=>{
      drawing=!drawing;
      canvas.isDrawingMode=drawing;
      canvas.freeDrawingBrush.width=3;
      canvas.freeDrawingBrush.color=getStroke();
      e.target.textContent=`畫筆：${drawing?'開':'關'}`;
    };

    document.getElementById('undo').onclick=()=>{
      if(undoStack.length<=1)return;
      redoStack.push(undoStack.pop());
      canvas.loadFromJSON(undoStack[undoStack.length-1],()=>canvas.renderAll());
    };
    document.getElementById('redo').onclick=()=>{
      if(!redoStack.length)return;
      const j=redoStack.pop(); undoStack.push(j);
      canvas.loadFromJSON(j,()=>canvas.renderAll());
    };

    document.getElementById('delete').onclick=()=>{
      const objs=canvas.getActiveObjects(); objs.forEach(o=>canvas.remove(o)); canvas.discardActiveObject();
    };
    document.getElementById('clear').onclick=()=>{ if(confirm('清空？'))canvas.clear(); snapshot(); };

    document.getElementById('download').onclick=()=>{
      const url=canvas.toDataURL({format:'png'});
      const a=document.createElement('a'); a.href=url; a.download='annotation.png'; a.click();
    };
  </script>
</body>
</html>
