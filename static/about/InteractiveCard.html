<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>About</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0d1015;
      --fg: #e6e9ef;
      --muted:#7e8797;
      --tile:#12151a;
      --tile-hover:#171b23;
      --accent:#5ea0ff;
    }
    *{box-sizing:border-box}
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", Arial;
      display:flex; justify-content:center; padding:40px 18px;
    }
    .layout {
      display:grid; grid-template-columns: 360px 1fr;
      gap:40px; width:min(1100px, 100%); align-items:start;
    }
    .title-area h1 {
      font-size: 26px; margin:0 0 12px; letter-spacing:.02em;
      font-weight:600;
    }
    .title-area p {
      margin:8px 0; line-height:1.6; font-size:15px; color:var(--muted);
    }
    .grid {
      display:grid; grid-template-columns: repeat(3, 1fr);
      gap:10px; padding-top:8px;
    }
    .tile {
      height:110px; border-radius:10px;
      background:var(--tile);
      border:1px solid rgba(255,255,255,.06);
      display:flex; align-items:center; justify-content:center;
      position:relative; cursor:default;
      transition: background .18s, transform .18s, border-color .18s;
    }
    .tile:hover {
      background:var(--tile-hover);
      border-color:rgba(236, 230, 230, 0.12);
    }
    .reveal {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      padding:10px; text-align:center;
      opacity:0; transform:translateY(6px);
      transition:opacity .25s, transform .25s;
      font-size:13.5px; line-height:1.4;
      color:var(--fg);
    }
    .tile.unlocked .reveal {
      opacity:1; transform:translateY(0);
    }
    .dot {
      position:absolute; width:5px; height:5px; border-radius:50%;
      background:var(--accent); top:8px; left:8px;
      opacity:.45; box-shadow:0 0 10px rgba(94,160,255,.3);
    }
    .right-text {
      padding-top:12px;
      font-size:15px; line-height:1.7; color:var(--fg);
    }
    @media(max-width:900px){
      .layout{grid-template-columns:1fr}
      .grid{justify-items:center}
    }
  </style>
</head>

<body>
  <div class="layout">
    <div class="title-area">
      <h1>關於我</h1>
      <p>一邊上班一邊薪偷研究有興趣的各種知識的工程師</p>
      <div class="grid" id="grid"></div>
    </div>

    <div class="right-text">
      <h2>網站介紹</h2>
      <p>Doc: 介紹、自製tool連結、玩遊戲影片連結</p>
      <p>Blog: 學習各種事物的除錯紀錄，比較雜亂一點，如果累積足夠大量的例子後會再整理起來</p>
      <p>Game: 玩的遊戲的攻略和整理</p>
    </div>
  </div>

  <script>
    const LINES = [
      "興趣：玩電腦、手機遊戲",
      "正在熟悉樹莓派和Arduino",
      "挑食",
      "興趣：看動畫和閱讀各種類型的書",
      "",
      " ",
      "天文迷",
      "不定期參與新領域課程與認證",
      "興趣：",
    ];

    const grid = document.getElementById('grid');

    LINES.forEach(text => {
      const t = document.createElement('div');
      t.className = 'tile';
      t.innerHTML = `
        <div class="dot"></div>
        <div class="reveal">${text}</div>
      `;
      grid.appendChild(t);

      // 解鎖規則：精準點擊中心才顯示
      t.addEventListener('mousemove', (e) => {
        const r = t.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height/2;
        const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
        t._centered = dist < r.width * 0.3;
      });
      t.addEventListener('click', () => {
        if (t._centered) {
          t.classList.add('unlocked');
        } else {
          t.animate([{transform:'translateY(0)'},{transform:'translateY(-4px)'},{transform:'translateY(0)'}],
                    {duration:160, easing:'ease-out'});
        }
      });
    });
  </script>
</body>
</html>
